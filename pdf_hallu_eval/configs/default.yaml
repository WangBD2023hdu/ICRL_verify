pdf_dir: /path/to/pdfs
output_dir: outputs/pdf_hallu_eval

model:
  base_url: http://localhost:8000/v1
  name: your-vision-model
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 4096
  timeout_s: 120
  retries: 3

batch:
  workers: 8
  resume: true
  parser: auto
  render_backend: auto
  dpi: 144
  preserve_newlines: false

prompt: |
  Transcribe all visible text on this PDF page exactly.
  Preserve reading order as much as possible.
  Do not summarize.
  Do not infer missing or unreadable text.
  If a character or word is unreadable, output [UNK].
  Return only the transcription text.

